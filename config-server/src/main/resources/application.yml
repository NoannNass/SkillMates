server:
  port: 8888
spring:
  application:
    name: configserver
  cloud:
    config:
      server:

        native:
          search-locations: classpath:/configuration
  profiles:
    active: native


#Actuator config
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true
  info:
    env:
      enabled: true