spring:
  application:
    name: session-service
  datasource:
    url: jdbc:mysql://mysql-session:3306/skillmates_session?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: session_user
    password: session_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
