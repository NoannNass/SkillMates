spring:
  application:
    name: user-service
  data:
    mongodb:
      uri: mongodb://skillMates:skillMates_password@mongodb-user-service:27017/admin
      database: skillMates

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
