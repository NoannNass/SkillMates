services:
  mongodb-user-service:
    image: mongo:latest
    container_name: mongodb-users
    restart: always
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: skillMates
      MONGO_INITDB_ROOT_PASSWORD: skillMates_password
      MONGO_INITDB_DATABASE: skillMates
    volumes:
      - mongodb-users-data:/data/db
    networks:
      - skillmates-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-partnership:
    image: mysql:8.0
    container_name: mysql-partnership
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: partnership
      MYSQL_ROOT_PASSWORD: password
      MYSQL_PASSWORD: password
    volumes:
      - mysql-partnership-data:/var/lib/mysql
    networks:
      - skillmates-network
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql-session:
    image: mysql:8.0
    container_name: mysql-session
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: skillmates_session
      MYSQL_USER: session_user
      MYSQL_PASSWORD: session_pass
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-session-data:/var/lib/mysql
    networks:
      - skillmates-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  config-server:
    image: noann/skillmates-config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - skillmates-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8888/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  discovery-service:
    image: noann/skillmates-discovery-service:latest
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    networks:
      - skillmates-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  user-service:
    image: noann/skillmates-user-service:latest
    container_name: user-service
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATA_MONGODB_URI: mongodb://skillMates:skillMates_password@mongodb-user-service:27017/admin
      SPRING_DATA_MONGODB_DATABASE: skillMates
    networks:
      - skillmates-network
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      mongodb-user-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8081/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  partnership:
    image: noann/skillmates-partnership:latest
    container_name: partnership
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    networks:
      - skillmates-network
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      mysql-partnership:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8082/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  session-service:
    image: noann/skillmates-session-service:latest
    container_name: session-service
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    networks:
      - skillmates-network
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      mysql-session:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8084/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web-app:
    image: noann/skillmates-web-app:latest
    container_name: web-app
    ports:
      - "8083:8083"
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    networks:
      - skillmates-network
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      partnership:
        condition: service_healthy
      session-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8083/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
  mongodb-users-data:
  mysql-partnership-data:
  mysql-session-data:

networks:
  healthcare:
    driver: bridge
  skillmates-network:
    driver: bridge
