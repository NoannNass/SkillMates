<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Créez votre profil - Informations personnelles</title>
    <link rel="stylesheet" href="/style.css">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
</head>

<body>
    <header class="header">
        <a href="/" class="logo"><span class="logo-circle">S</span>SkillMates</a>
    </header>
    <div class="progress-bar">
        <div class="progress" style="width: 25%"></div>
    </div>
    <div class="container">
        <h2>Créez votre profil</h2>
        <form th:action="@{/profile-completion/step1}" th:object="${personalInfo}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-step">
                <h3>Informations personnelles</h3>
                <div class="profile-picture-upload">
                    <div class="avatar-circle">N</div>
                    <label>
                        <input type="file" name="profilePicture" accept="image/*" style="display:none;" />
                        <span><svg width="18" height="18" fill="currentColor" viewBox="0 0 20 20">
                                <path
                                    d="M16.707 9.293a1 1 0 00-1.414 0L11 13.586V3a1 1 0 10-2 0v10.586l-4.293-4.293a1 1 0 00-1.414 1.414l6 6a1 1 0 001.414 0l6-6a1 1 0 000-1.414z">
                                </path>
                            </svg></span>
                    </label>
                    <p>Ajoutez une photo de profil (recommandé)</p>
                </div>
                <div class="form-group">
                    <label for="username">Nom d'affichage</label>
                    <input type="text" id="username" th:field="*{username}"
                        placeholder="Comment souhaitez-vous être appelé ?" required />
                </div>
                <div class="form-group">
                    <label for="bio">Courte biographie</label>
                    <textarea id="bio" th:field="*{bio}" maxlength="200"
                        placeholder="Parlez brièvement de vous, de votre parcours et de vos objectifs d'apprentissage..."></textarea>
                    <small>Maximum 200 caractères</small>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Suivant &rarr;</button>
            </div>
        </form>
    </div>
</body>

</html>
