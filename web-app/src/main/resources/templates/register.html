<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Inscription - SkillMates</title>
    <link rel="stylesheet" href="/style.css">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
</head>

<body>
    <header class="header">
        <a href="/" class="logo"><span class="logo-circle">S</span>SkillMates</a>
    </header>
    <section class="form-section">
        <div class="form-card">
            <h1>Créer un compte</h1>
            <div class="subtitle">Créez votre compte et commencez votre parcours d'apprentissage collaboratif</div>
            <form action="/register" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div th:if="${error}" class="error-message" th:text="${error}"></div>
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" placeholder="Votre nom" required>

                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" placeholder="votre@email.com" required>

                <label for="password">Mot de passe</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Créez un mot de passe sécurisé"
                        required minlength="8">
                    <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Afficher le mot de passe">
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-off-icon" style="display:none" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
                <div class="password-rules" id="passwordRules">
                    <div class="rule" id="ruleLower"><span class="rule-icon">&#10005;</span> Au moins une minuscule</div>
                    <div class="rule" id="ruleUpper"><span class="rule-icon">&#10005;</span> Au moins une majuscule</div>
                    <div class="rule" id="ruleDigit"><span class="rule-icon">&#10005;</span> Au moins un chiffre</div>
                    <div class="rule" id="ruleLength"><span class="rule-icon">&#10005;</span> Minimum 8 caractères</div>
                </div>

                <button type="submit">Créer mon compte&nbsp;&rarr;</button>
            </form>
            <div class="form-footer">
                Déjà un compte ? <a href="/login">Se connecter</a>
            </div>
        </div>
    </section>
    <script>
        function togglePassword(inputId, btn) {
            var input = document.getElementById(inputId);
            var eyeIcon = btn.querySelector('.eye-icon');
            var eyeOffIcon = btn.querySelector('.eye-off-icon');
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.style.display = 'none';
                eyeOffIcon.style.display = 'block';
            } else {
                input.type = 'password';
                eyeIcon.style.display = 'block';
                eyeOffIcon.style.display = 'none';
            }
        }

        document.getElementById('password').addEventListener('input', function () {
            var val = this.value;
            updateRule('ruleLower', /[a-z]/.test(val));
            updateRule('ruleUpper', /[A-Z]/.test(val));
            updateRule('ruleDigit', /[0-9]/.test(val));
            updateRule('ruleLength', val.length >= 8);
        });

        function updateRule(id, valid) {
            var el = document.getElementById(id);
            var icon = el.querySelector('.rule-icon');
            if (valid) {
                el.classList.add('valid');
                el.classList.remove('invalid');
                icon.innerHTML = '&#10003;';
            } else {
                el.classList.remove('valid');
                el.classList.add('invalid');
                icon.innerHTML = '&#10005;';
            }
        }
    </script>
</body>

</html>
