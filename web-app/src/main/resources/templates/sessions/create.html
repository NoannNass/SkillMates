<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Créer une session</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
</head>

<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><span class="logo-circle">S</span>SkillMates</div>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard">
                    <i class="fas fa-chart-line"></i>
                    <span>Tableau de bord</span>
                </a>
                <a href="/profil">
                    <i class="fas fa-user"></i>
                    <span>Mon profil</span>
                </a>


                <a href="/sessions" class="active">
                    <i class="fas fa-calendar"></i>
                    <span>Sessions</span>
                </a>

                <a href="/partnerships">
                    <i class="fas fa-users"></i>
                    <span>Partenaires</span>
                </a>
            </nav>
            <div class="sidebar-footer">

                <form th:action="@{/logout}" method="post" class="logout-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="link-like"
                        style="background:none;border:none;padding:0;color:inherit;cursor:pointer;">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Déconnexion</span>
                    </button>
                </form>
            </div>
        </div>

        <div class="main-content">
            <header class="dash-header">
                <h1>Créer une session</h1>
                <a th:href="@{/sessions}" class="btn">Retour</a>
            </header>

            <div class="card">
                <form th:action="@{/sessions}" th:object="${form}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="form-group">
                        <label>Titre</label>
                        <input type="text" th:field="*{title}" />
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea th:field="*{description}"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Type</label>
                        <select th:field="*{type}">
                            <option th:value="VIRTUAL">VIRTUELLE</option>
                            <option th:value="PHYSICAL">PHYSIQUE</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Lieu/Lien</label>
                        <input type="text" th:field="*{locationOrLink}" />
                        <div class="field-error" th:if="${#fields.hasErrors('locationOrLink')}"
                            th:errors="*{locationOrLink}"></div>
                    </div>

                    <div class="form-group">
                        <label>Début</label>
                        <input type="datetime-local" th:field="*{startAt}" />
                        <div class="field-error" th:if="${#fields.hasErrors('startAt')}" th:errors="*{startAt}"></div>
                    </div>

                    <div class="form-group">
                        <label>Fin</label>
                        <input type="datetime-local" th:field="*{endAt}" />
                        <div class="field-error" th:if="${#fields.hasErrors('endAt')}" th:errors="*{endAt}"></div>
                    </div>

                    <div class="form-group">
                        <label>Choisi un mates</label>
                        <select th:field="*{partnerId}">
                            <option value="" disabled selected>choisi un partenaire</option>
                            <option th:each="opt : ${partnerOptions}" th:value="${opt.id}" th:text="${opt.name}">
                            </option>
                        </select>
                        <div class="field-error" th:if="${#fields.hasErrors('partnerId')}" th:errors="*{partnerId}">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Créer</button>
                    <div class="form-error" th:if="${#fields.hasGlobalErrors()}"
                        th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
