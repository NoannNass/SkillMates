<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Détails session</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
</head>

<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><span class="logo-circle">S</span>SkillMates</div>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard">
                    <i class="fas fa-chart-line"></i>
                    <span>Tableau de bord</span>
                </a>
                <a href="/profil">
                    <i class="fas fa-user"></i>
                    <span>Mon profil</span>
                </a>


                <a href="/sessions" class="active">
                    <i class="fas fa-calendar"></i>
                    <span>Sessions</span>
                </a>

                <a href="/partnerships">
                    <i class="fas fa-users"></i>
                    <span>Partenaires</span>
                </a>
            </nav>
            <div class="sidebar-footer">

                <form th:action="@{/logout}" method="post" class="logout-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="link-like"
                        style="background:none;border:none;padding:0;color:inherit;cursor:pointer;">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Déconnexion</span>
                    </button>
                </form>
            </div>
        </div>

        <div class="main-content">
            <header class="dash-header">
                <h1 th:text="${learningSession.title}">Session</h1>
                <div style="display:flex; gap:8px; align-items:center;">
                    <a th:href="@{/sessions}" class="btn">Retour</a>
                    <form th:if="${learningSession.status.name() == 'PLANNED'}"
                        th:action="@{'/sessions/' + ${learningSession.id} + '/cancel'}" method="post"
                        style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn" style="background:#e74c3c; color:#fff;">Annuler</button>
                    </form>
                    <form th:if="${learningSession.status.name() == 'PLANNED'}"
                        th:action="@{'/sessions/' + ${learningSession.id} + '/complete'}" method="post"
                        style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn" style="background:#27ae60; color:#fff;">Terminer</button>
                    </form>
                </div>
            </header>

            <div class="card">
                <p><b>Statut:</b> <span th:text="${learningSession.status}"></span></p>
                <p><b>Début:</b> <span th:text="${learningSession.startAt}"></span></p>
                <p><b>Fin:</b> <span th:text="${learningSession.endAt}"></span></p>
                <p><b>Type:</b> <span th:text="${learningSession.type}"></span></p>
                <p><b>Lieu/Lien:</b> <span th:text="${learningSession.locationOrLink}"></span></p>
                <p><b>Partenaire:</b> <span th:text="${learningSession.counterpartyName}"></span></p>
            </div>
        </div>
    </div>
</body>

</html>
