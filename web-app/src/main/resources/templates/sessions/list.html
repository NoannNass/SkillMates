<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Sessions</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><span class="logo-circle">S</span>SkillMates</div>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard">
                    <i class="fas fa-chart-line"></i>
                    <span>Tableau de bord</span>
                </a>
                <a href="/profil">
                    <i class="fas fa-user"></i>
                    <span>Mon profil</span>
                </a>
                <a href="#">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Mes apprentissages</span>
                </a>
                <a href="#">
                    <i class="fas fa-bullseye"></i>
                    <span>Objectifs</span>
                </a>
                <a href="/sessions" class="active">
                    <i class="fas fa-calendar"></i>
                    <span>Session</span>
                </a>
                <a href="#">
                    <i class="fas fa-comments"></i>
                    <span>Messages</span>
                </a>
                <a href="/partnerships">
                    <i class="fas fa-users"></i>
                    <span>Partenaires</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#">
                    <i class="fas fa-cog"></i>
                    <span>Paramètres</span>
                </a>
                <a href="/logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </a>
            </div>
        </div>

        <div class="main-content">
            <header class="dash-header">
                <h1>Mes sessions</h1>
                <a class="btn-primary" th:href="@{/sessions/new}">Créer une session</a>
            </header>

            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Titre</th>
                            <th>Début</th>
                            <th>Fin</th>
                            <th>Statut</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${sessions}">
                            <td th:text="${s.title}"></td>
                            <td th:text="${s.startAt}"></td>
                            <td th:text="${s.endAt}"></td>
                            <td th:text="${s.status}"></td>
                            <td>
                                <a th:href="@{'/sessions/' + ${s.id}}">Détails</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(sessions)}">
                            <td colspan="5">Aucune session</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
